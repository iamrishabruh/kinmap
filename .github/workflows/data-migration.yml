name: data-migration

# Production migrations run only after GitHub environment approval (spec §15).

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [development, staging, production]
        required: true
      action:
        type: choice
        options: [list, plan, apply, verify, rollback]
        default: plan
        required: true
      migration-id:
        description: Required for rollback
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: data-migration-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    name: ${{ inputs.action }}-${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Require a migration id for rollback
        if: inputs.action == 'rollback'
        run: |
          [[ -n "${{ inputs.migration-id }}" ]] || {
            echo "::error::rollback requires migration-id."; exit 1; }

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_MIGRATION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-migration-${{ inputs.environment }}

      # A plan always runs first so the approval record shows what will change.
      - name: Plan
        if: inputs.action == 'apply'
        run: pnpm migration:plan --env ${{ inputs.environment }}

      - name: Run
        run: |
          set -euo pipefail
          case "${{ inputs.action }}" in
            list)     pnpm migration:list ;;
            plan)     pnpm migration:plan --env ${{ inputs.environment }} ;;
            verify)   pnpm migration:verify --env ${{ inputs.environment }} ;;
            apply)    pnpm migration:apply --env ${{ inputs.environment }} ;;
            rollback) pnpm migration:rollback --env ${{ inputs.environment }} --id "${{ inputs.migration-id }}" ;;
          esac

      - name: Verify after apply
        if: inputs.action == 'apply'
        run: pnpm migration:verify --env ${{ inputs.environment }}
