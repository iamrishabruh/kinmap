name: codeql

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ${{ matrix.language == 'swift' && 'macos-15' || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Build mode per language, because one setting does not fit all three.
        #
        # Autobuild failed outright on Java/Kotlin — "Could not detect a
        # suitable build command for the source checkout" — because the Gradle
        # project is at apps/mobile/android and autobuild looks from the
        # repository root. `none` then failed differently: "CodeQL detected code
        # written in Java/Kotlin but could not process any of it using the
        # 'none' build mode", because buildless extraction does not understand
        # the Expo module layout under apps/mobile/modules.
        #
        # So Java/Kotlin gets the same Gradle build the android job already
        # runs. That is the one language here where dropping analysis would
        # matter: the Kotlin IS the location engine — foreground service,
        # encrypted event queue, permission monitor — which is exactly the code
        # a security scan should see.
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      # Expo autolinking resolves native modules through node_modules, so the
      # Gradle build cannot run without the workspace installed first. Without
      # this the build failed and CodeQL analysed nothing.
      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up pnpm
        if: matrix.language == 'java-kotlin'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }

      - name: Install workspace
        if: matrix.language == 'java-kotlin'
        run: pnpm install --frozen-lockfile

      - name: Build for CodeQL
        if: matrix.language == 'java-kotlin'
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Analyze
        uses: github/codeql-action/analyze@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          category: /language:${{ matrix.language }}
