name: ci

# Job names below MUST match the required status checks configured in the
# repository rulesets (scripts/bootstrap/bootstrap.sh -> configure_github_rulesets).
# Renaming a job here silently disables branch protection for that check.

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  EXPO_NO_TELEMETRY: "1"
  DO_NOT_TRACK: "1"

jobs:
  setup:
    name: setup
    runs-on: ubuntu-latest
    outputs:
      store-path: ${{ steps.pnpm.outputs.store-path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - id: pnpm
        run: echo "store-path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: "**/coverage/**"
          retention-days: 7
          if-no-files-found: ignore

  contract-tests:
    name: contract-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:contract

  infrastructure-tests:
    name: infrastructure-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:infra

  cdk-synth:
    name: cdk-synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Synth must succeed with placeholder account ids so a fork PR can be
      # validated without any AWS credentials.
      - run: |
          pnpm --filter @family/web build
          pnpm --filter @family/infrastructure exec cdk synth --quiet
        env:
          CDK_ENVIRONMENT: development
          KINMAP_HOSTED_ZONE_ID_DEVELOPMENT: ${{ secrets.KINMAP_HOSTED_ZONE_ID_DEVELOPMENT }}
          KINMAP_API_ORIGIN_DOMAIN_DEVELOPMENT: ${{ secrets.KINMAP_API_ORIGIN_DOMAIN_DEVELOPMENT }}
          AWS_DEV_ACCOUNT_ID: "000000000000"
          AWS_STAGING_ACCOUNT_ID: "000000000000"
          AWS_PROD_ACCOUNT_ID: "000000000000"
          AWS_REGION: us-east-1

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Secret scan
        run: ./scripts/validation/check-secrets.sh

      # This job had no toolchain at all, so every step below it that needs one
      # exited 127 — "pnpm: command not found" — and the identity check in
      # particular had therefore never run anywhere.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Mobile app resolves its own identity without .env.local
        run: pnpm run validate:mobile-identity
      - name: Fail if a native permission string is vague
        # App Review rejects vague copy, and vague copy is dishonest to users.
        run: |
          set -euo pipefail
          if grep -rIn "uses your location" apps/mobile/app.config.ts 2>/dev/null; then
            echo "::error::Permission copy must explain what is shared, with whom, and how to stop."
            exit 1
          fi

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  mobile-android-build-check:
    name: mobile-android-build-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - name: Verify committed native project matches app.config.ts
        run: ./scripts/validation/check-prebuild-consistency.sh
        env:
          APP_VARIANT: development
      # check-prebuild-consistency.sh restores the COMMITTED native projects
      # when it finishes, which is what makes it non-destructive — and which
      # also removes the debug keystore prebuild had just generated. Gradle then
      # fails: "Keystore file .../debug.keystore not found for signing config
      # 'debug'". The keystore is gitignored, correctly: it is generated signing
      # material, not configuration.
      - name: Restore generated native artefacts
        run: pnpm --filter @family/mobile prebuild
      - name: Assemble debug
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Unit tests
        working-directory: apps/mobile/android
        run: ./gradlew test --no-daemon

  mobile-ios-build-check:
    name: mobile-ios-build-check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install --repo-update
      - name: Build for simulator
        working-directory: apps/mobile/ios
        run: |
          set -euo pipefail
          workspace="$(ls -d ./*.xcworkspace | head -1)"
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify || xcodebuild \
            -workspace "$workspace" -scheme "$scheme" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    needs: [unit-tests, contract-tests]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Smoke test the API handler in-process
        run: pnpm --filter @family/api run test:smoke
