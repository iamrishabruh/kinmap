name: submit-android

# Uploads to the Play internal testing track as a DRAFT. Promotion to production
# and public rollout are deliberate human actions in the Play Console.

on:
  workflow_dispatch:
    inputs:
      build-id:
        description: EAS build ID to submit (leave blank for the latest production build)
        required: false
        type: string
      acknowledge:
        description: Type INTERNAL-TRACK-ONLY to confirm you are not releasing publicly
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit:
    name: submit-play-internal
    runs-on: ubuntu-latest
    environment: google-play # requires manual approval
    steps:
      - name: Confirm scope
        run: |
          [[ "${{ inputs.acknowledge }}" == "INTERNAL-TRACK-ONLY" ]] || {
            echo "::error::This workflow uploads to the internal track only."; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # 9.0.1
        with:
          eas-version: 21.4.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile

      - name: EAS Submit to Play internal track
        working-directory: apps/mobile
        run: |
          if [[ -n "${{ inputs.build-id }}" ]]; then
            eas submit --platform android --profile production --id "${{ inputs.build-id }}" --non-interactive
          else
            eas submit --platform android --profile production --latest --non-interactive
          fi

      - run: echo "Uploaded as a draft on the internal track. Promotion requires explicit approval in the Play Console."
