name: submit-ios

# Uploads a finished build to TestFlight ONLY. Releasing to the public App Store
# is a deliberate, human action in App Store Connect and is never automated here.

on:
  workflow_dispatch:
    inputs:
      build-id:
        description: EAS build ID to submit (leave blank for the latest production build)
        required: false
        type: string
      acknowledge:
        description: Type TESTFLIGHT-ONLY to confirm you are not releasing publicly
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit:
    name: submit-testflight
    runs-on: ubuntu-latest
    environment: app-store # requires manual approval
    steps:
      - name: Confirm scope
        run: |
          [[ "${{ inputs.acknowledge }}" == "TESTFLIGHT-ONLY" ]] || {
            echo "::error::This workflow uploads to TestFlight only."; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version-file: .nvmrc, cache: pnpm }
      - uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # 9.0.0
        with:
          eas-version: 21.4.0
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile

      - name: EAS Submit to TestFlight
        working-directory: apps/mobile
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [[ -n "${{ inputs.build-id }}" ]]; then
            eas submit --platform ios --profile production --id "${{ inputs.build-id }}" --non-interactive
          else
            eas submit --platform ios --profile production --latest --non-interactive
          fi

      - run: echo "Uploaded to TestFlight. Public release requires explicit approval in App Store Connect."
