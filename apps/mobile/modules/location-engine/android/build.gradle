apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.familylocation.locationengine'
version = '0.1.0'

def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()

android {
  namespace "com.familylocation.locationengine"
  compileSdk 36

  defaultConfig {
    minSdk 24
    consumerProguardFiles 'consumer-rules.pro'
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "org.jetbrains.kotlin:kotlin-stdlib:${kotlinVersion}"

  // Fused Location Provider and the Geofencing API.
  implementation 'com.google.android.gms:play-services-location:21.3.0'

  // Deferred, constraint-aware upload work that survives process death.
  implementation 'androidx.work:work-runtime-ktx:2.10.0'

  // Keystore-backed encryption for the on-device event queue.
  implementation 'androidx.security:security-crypto:1.1.0-alpha06'

  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
